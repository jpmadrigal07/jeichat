name: Test

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jeichat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jeichat_test
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long!!

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Unit tests
        run: bun run test

      - name: Session e2e
        run: bun run test:e2e:session
