# Local / VPS: web + API + Postgres.
# Web starts only after API /health succeeds (migrate ran and API is up).
# Coolify: disable git auto-deploy on web + API; use .github/workflows/deploy.yml.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jeichat
      POSTGRES_PASSWORD: jeichat
      POSTGRES_DB: jeichat
    ports:
      - '5432:5432'
    volumes:
      - jeichat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jeichat -d jeichat']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://jeichat:jeichat@postgres:5432/jeichat
      BETTER_AUTH_SECRET: change-me-jeichat-docker-secret-32ch
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_CREDENTIALS: 'true'
      # Voice channels (optional) — taken from your shell or a root .env; blank disables voice.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_API_CREDENTIALS: 'true'
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  jeichat_pg:
